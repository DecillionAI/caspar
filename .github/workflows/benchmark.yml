name: Caspar Cluster Benchmark

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cluster mode'
        required: false
        default: triple
        type: choice
        options: [single, triple]
      skip_build:
        description: 'Skip cargo build (use checked-in dist/ binaries — default)'
        required: false
        default: 'true'
        type: boolean

  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC

# The bot needs write access to push report commits back to the repo.
permissions:
  contents: write

jobs:
  benchmark:
    name: ${{ inputs.mode || 'triple' }}-node benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3 h: ~50 m build + ~15 m startup + ~60 m bench

    env:
      MODE: ${{ inputs.mode || 'triple' }}

    steps:

      # ═══════════════════════════════════════════════════════════════════════
      # 1. SOURCE
      # ═══════════════════════════════════════════════════════════════════════

      - name: Checkout caspar
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # bench-all.sh looks for decillionai-server/bench/{deploy.py,workflow_tests.py}
      # next to the caspar repo.  We check it out inside the workspace and tell
      # bench-all.sh its exact location via the DECILLIONAI_SERVER env var.
      - name: Checkout decillionai-server (bench scripts)
        uses: actions/checkout@v4
        with:
          repository: DecillionAI/decillionai-server
          # If the repo is private, add a PAT in repo secrets and uncomment:
          # token: ${{ secrets.DECILLIONAI_TOKEN }}
          path: _decillionai-server

      # ═══════════════════════════════════════════════════════════════════════
      # 2. RUNTIME TOOLING
      # ═══════════════════════════════════════════════════════════════════════

      - name: Set up Java 17  (required by QuestDB)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3  (required by bench scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pycryptodome  (required by deploy.py)
        run: pip3 install pycryptodome --quiet

      # ═══════════════════════════════════════════════════════════════════════
      # 3. BUILD  (skip if skip_build=true and dist/ is already populated)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Install Rust stable
        if: ${{ inputs.skip_build == 'false' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        if: ${{ inputs.skip_build == 'false' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            node         -> target
            cmd/casparctl -> target

      - name: Install WasmEdge 0.14.0
        if: ${{ inputs.skip_build == 'false' }}
        run: |
          curl -sSf \
            https://raw.githubusercontent.com/WasmEdge/WasmEdge/0.14.0/utils/install.sh \
            | bash -s -- -v 0.14.0
          echo "WASMEDGE_LIB_DIR=$HOME/.wasmedge/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/.wasmedge/lib"  >> $GITHUB_ENV
          echo "$HOME/.wasmedge/bin"                  >> $GITHUB_PATH

      - name: Build dist/  (caspar-node, caspar-keygen, casparctl, WasmEdge, QuestDB)
        if: ${{ inputs.skip_build == 'false' }}
        run: bash build-dist.sh

      # ═══════════════════════════════════════════════════════════════════════
      # 4. DOCKER IMAGE
      # ═══════════════════════════════════════════════════════════════════════

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build caspar-node Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: node/Dockerfile
          push: false
          # load: true makes the image available to the local Docker daemon so
          # run-nodes.sh can find it via `docker image inspect caspar-node:latest`
          # and skip the redundant rebuild step.
          load: true
          tags: caspar-node:latest
          # Firecracker is not used in CI (run-nodes.sh is called with
          # --no-firecracker), so skip the binary + kernel downloads to keep
          # the image lean and avoid optional S3/GitHub download failures.
          build-args: |
            INSTALL_FIRECRACKER=false
          # Layer cache — dramatically speeds up repeat runs
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ═══════════════════════════════════════════════════════════════════════
      # 5. START CLUSTER  +  CREATURE BUILD/DEPLOY
      #    run-nodes.sh owns the full bootstrap: per-node RSA + babble keys,
      #    .env files (including the per-container QuestDB port set),
      #    peers.genesis.json, container startup, tinygo install, WASM
      #    creature build via decillionai-server/build-all.sh, and the
      #    deploy.py push that writes ~/deployment_report.json.  The
      #    DECILLIONAI_SERVER env tells run-nodes.sh to reuse the checkout
      #    above instead of cloning a second copy.
      # ═══════════════════════════════════════════════════════════════════════

      - name: Start ${{ env.MODE }}-node cluster + deploy WASM creatures  (run-nodes.sh)
        run: bash run-nodes.sh "$MODE" --no-gvisor --no-firecracker
        env:
          DECILLIONAI_SERVER: ${{ github.workspace }}/_decillionai-server
        timeout-minutes: 30

      # run-nodes.sh writes /tmp/caspar/deploy.failed if deploy was partial.
      # We surface that here as a real failed step so the benchmark step does
      # not run against a half-deployed cluster (which previously produced a
      # silent green run with "No nodes reachable" in the bench log).
      - name: Verify creature deployment succeeded
        run: |
          if [[ -f /tmp/caspar/deploy.failed ]]; then
            echo "::error::Creature deployment failed during run-nodes.sh — refusing to run benchmark."
            exit 1
          fi
          if [[ ! -s "$HOME/deployment_report.json" ]]; then
            echo "::error::deployment_report.json missing or empty — deploy did not complete."
            exit 1
          fi
          python3 - "$HOME/deployment_report.json" <<'PYEOF'
          import json, sys
          reps = json.load(open(sys.argv[1]))
          if not isinstance(reps, list) or not reps:
              print("::error::deployment_report.json is not a non-empty list"); sys.exit(1)
          bad = [r for r in reps if not isinstance(r, dict) or r.get('ok_count', 0) == 0]
          if bad:
              names = ', '.join(r.get('node', '?') for r in bad)
              print(f"::error::Nodes with zero successful deploys: {names}"); sys.exit(1)
          errs = sum(r.get('error_count', 0) for r in reps)
          if errs:
              print(f"::error::Deployment report contains {errs} error(s)"); sys.exit(1)
          print(f"Deployment OK: {len(reps)} node(s), {sum(r.get('ok_count',0) for r in reps)} modules.")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════════
      # 6. BENCHMARK
      #    --skip-deploy because run-nodes.sh already deployed and produced
      #    ~/deployment_report.json; bench-all.sh runs only workflow_tests.py.
      # ═══════════════════════════════════════════════════════════════════════

      - name: Run benchmark suite  (bench-all.sh)
        run: bash bench-all.sh "$MODE" --skip-deploy
        env:
          DECILLIONAI_SERVER: ${{ github.workspace }}/_decillionai-server
        timeout-minutes: 60

      - name: Verify benchmark results
        run: |
          if [[ ! -s "$HOME/workflow_results.json" ]]; then
            echo "::error::workflow_results.json missing — benchmark did not produce results."
            exit 1
          fi
          python3 - "$HOME/workflow_results.json" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d.get('summary') or {}
          total, passed, failed = s.get('total', 0), s.get('passed', 0), s.get('failed', 0)
          if total == 0:
              print("::error::Benchmark summary reports zero total steps"); sys.exit(1)
          if failed:
              print(f"::error::Benchmark has {failed}/{total} failed step(s)"); sys.exit(1)
          print(f"Benchmark OK: {passed}/{total} passed.")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════════
      # 7. CAPTURE CONTAINER LOGS  (must run BEFORE stop-nodes.sh tears them
      # down — once the container is gone, `docker logs` is gone too)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Capture container logs
        if: always()
        run: |
          mkdir -p /tmp/caspar
          for n in 1 2 3; do
            if docker inspect "caspar-node${n}" >/dev/null 2>&1; then
              docker logs "caspar-node${n}" \
                > "/tmp/caspar/node${n}.docker.log" 2>&1 || true
              docker inspect "caspar-node${n}" \
                > "/tmp/caspar/node${n}.docker.inspect.json" 2>&1 || true
              echo "captured caspar-node${n}: $(wc -l < /tmp/caspar/node${n}.docker.log) lines"
            else
              echo "caspar-node${n}: container not present"
            fi
          done

      # ═══════════════════════════════════════════════════════════════════════
      # 8. TEARDOWN  (always runs so logs are always collected)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Stop cluster  (stop-nodes.sh)
        if: always()
        run: bash stop-nodes.sh

      # ═══════════════════════════════════════════════════════════════════════
      # 9. COLLECT & PUBLISH REPORTS
      # ═══════════════════════════════════════════════════════════════════════

      - name: Collect report files
        if: always()
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          DEST="reports/${TS}"
          mkdir -p "${DEST}" reports/latest

          copy_report() {
            [[ -f "$1" ]] || return 0
            cp "$1" "${DEST}/"
            cp "$1" reports/latest/
            echo "  + $(basename "$1")  ($(du -sh "$1" | cut -f1))"
          }

          echo "=== Benchmark reports ==="
          copy_report ~/workflow_results.json
          copy_report ~/workflow_report.md
          copy_report ~/deployment_report.json
          copy_report /tmp/caspar/bench.log
          copy_report /tmp/caspar/deploy.log

          echo "=== Node logs ==="
          for n in 1 2 3; do
            # Local-mode log lives on the host; docker-mode logs were captured
            # in the previous step (before stop-nodes.sh tore the container
            # down) — pull both so post-mortems work regardless of which mode
            # the run used.
            log="/tmp/caspar/node${n}/node.log"
            if [[ -f "$log" ]]; then
              cp "$log" "${DEST}/node${n}.log"
              echo "  + node${n}.log  ($(wc -l < "$log") lines)"
            fi
            dlog="/tmp/caspar/node${n}.docker.log"
            if [[ -f "$dlog" ]]; then
              cp "$dlog" "${DEST}/node${n}.docker.log"
              echo "  + node${n}.docker.log  ($(wc -l < "$dlog") lines)"
            fi
            dinsp="/tmp/caspar/node${n}.docker.inspect.json"
            [[ -f "$dinsp" ]] && cp "$dinsp" "${DEST}/node${n}.docker.inspect.json"
            qdb="/tmp/caspar/node${n}/questdb.log"
            if [[ -f "$qdb" ]]; then
              cp "$qdb" "${DEST}/node${n}.questdb.log"
              echo "  + node${n}.questdb.log  ($(wc -l < "$qdb") lines)"
            fi
            env_file="/tmp/caspar/node${n}/.env"
            if [[ -f "$env_file" ]]; then
              # Strip the OWNER_PRIVATE_KEY block before publishing.
              awk '/^OWNER_PRIVATE_KEY=/{skip=1} skip && /"$/{skip=0; next} !skip' \
                "$env_file" > "${DEST}/node${n}.env"
              echo "  + node${n}.env  ($(wc -l < "${DEST}/node${n}.env") lines)"
            fi
          done

          echo "REPORT_TS=${TS}"    >> $GITHUB_ENV
          echo "REPORT_DIR=${DEST}" >> $GITHUB_ENV

      # Print the KPI markdown report directly in the GitHub Actions run summary
      - name: Publish KPI summary to run page
        if: always()
        run: |
          {
            echo "## 🚀 Caspar Benchmark — run \`#${{ github.run_number }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Mode** | \`${MODE}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Triggered by** | ${{ github.actor }} |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [[ -f ~/workflow_report.md ]]; then
            cat ~/workflow_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ No report generated — check the bench log in the artifact." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

      # Push the timestamped reports + latest/ back into the repo so they are
      # accessible without downloading the Actions artifact.
      - name: Commit and push reports to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report files to commit."
            exit 0
          fi
          git commit \
            -m "chore(reports): run #${{ github.run_number }} ${REPORT_TS}" \
            -m "Mode: ${MODE}" \
            -m "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Triggered by: ${{ github.actor }}"
          git push
