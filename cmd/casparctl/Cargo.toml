[package]
name = "casparctl"
version = "0.1.0"
edition = "2021"
description = "Caspar control CLI — Docker lifecycle, multi-section telemetry dashboard, runtime profiling."

[[bin]]
name = "casparctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
