[package]
name = "casparctl"
version = "0.1.0"
edition = "2021"
description = "Caspar control CLI — manages the Caspar Docker container + telemetry dashboard."

[[bin]]
name = "casparctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
