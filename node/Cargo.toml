[package]
name = "caspar-node"
version = "0.1.0"
edition = "2021"
description = "Caspar node — Rust translation of the Caspar (kasper) Go node"

[[bin]]
name = "caspar-node"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["."]
exclude = ["crates/appengine"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
