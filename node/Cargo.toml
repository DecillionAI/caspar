[package]
name = "caspar-node"
version = "0.1.0"
edition = "2021"
description = "Caspar node — Rust translation of the Caspar (kasper) Go node"

[[bin]]
name = "caspar-node"
path = "src/main.rs"

[[bin]]
name = "caspar-keygen"
path = "src/bin/keygen.rs"

[workspace]
resolver = "2"
members = ["."]


[workspace.dependencies]
async-wasi = { path = "crates/async-wasi", version = "0.2.0" }
cfg-if = "1.0.0"
parking_lot = "0.12.1"
wasmedge-macro = { path = "crates/wasmedge-macro", version = "0.6" }
wasmedge-types = { path = "crates/wasmedge-types", version = "0.6" }
wat = "1.0"

# Local workspace crates re-exposed for `caspar-node`. The package
# names follow the per-crate `[package].name` (the elpian crate uses
# the underscored form, the others use the hyphenated form).
elpian_vm    = { path = "crates/elpian-vm",   version = "0.1.0" }
elpify-lang  = { path = "crates/elpify-lang", version = "0.1.0" }
wasmedge-sys = { path = "crates/wasmedge-sys", version = "0.19.4" }

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.15"
dashmap = "6.2.1"
getrandom = "0.2"
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa", "arithmetic"] }
libc = "0.2"
log = "0.4.29"
num-bigint = "0.4.6"
postgres = "0.19.13"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rand = "0.10.1"
rocksdb = "0.24.0"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.18"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1.23.1", features = ["v4"] }
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"] }

# VMM driver dependencies (Docker / WASM / Miden / HTTP / async stream
# helpers). Several VMM controllers live behind the prelude in
# `src/drivers/vmm/prelude.rs`; without these crates the whole `vmm`
# module fails to compile and the binary cannot link.
blockingqueue = "0.1"
bollard = "0.17"
futures-util = "0.3"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
timedmap = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

# Local workspace crates used by the VMM driver. (`elpian_vm`'s
# package name has an underscore — see the comment in [workspace.dependencies].)
elpian_vm = { workspace = true }
elpify-lang = { workspace = true }
wasmedge-sys = { workspace = true }
wasmedge-types = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
